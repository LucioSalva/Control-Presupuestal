<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <style>
    :root {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");
        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }
        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Gráfica de Partidas — Control Presupuestal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/dashboard_partidas_grafica.css">
</head>

<body class="dashboard-partidas-page">
  <div id="cp-navbar"></div>

  <main class="container-fluid py-4">
    <div class="container-xxl">
      <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-3">
        <div>
          <h2 class="mb-1">Gráfica de Partidas</h2>
          <div class="text-muted">Usa los filtros para analizar por periodo, área y partida</div>
        </div>
        <div class="d-flex gap-2">
          <button id="btnActualizar" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
          </button>
        </div>
      </div>

      <div class="card shadow-sm dp-card mb-3">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-4 col-lg-2">
              <label for="fPeriodo" class="form-label">Periodo</label>
              <select id="fPeriodo" class="form-select"></select>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label for="fAnio" class="form-label">Año</label>
              <input id="fAnio" type="number" class="form-control" min="2000" />
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label id="lblSegmento" for="fSegmento" class="form-label">Mes</label>
              <select id="fSegmento" class="form-select"></select>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fArea" class="form-label">DG</label>
              <select id="fArea" class="form-select">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fDauxiliar" class="form-label">DA</label>
              <select id="fDauxiliar" class="form-select">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fPartida" class="form-label">Partida</label>
              <input id="fPartida" type="text" class="form-control" placeholder="Ej. 5151" />
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fNivel" class="form-label">Nivel</label>
              <select id="fNivel" class="form-select">
                <option value="CAPITULO">Capítulo</option>
                <option value="PARTIDA">Partida</option>
              </select>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fCapitulo" class="form-label">Capítulo</label>
              <input id="fCapitulo" type="text" class="form-control" placeholder="Ej. 5000" />
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fTipo" class="form-label">Tipo</label>
              <select id="fTipo" class="form-select">
                <option value="bar">Barras</option>
                <option value="pie">Pastel</option>
              </select>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label for="fMetrica" class="form-label">Métrica</label>
              <select id="fMetrica" class="form-select">
                <option value="presupuesto">Presupuesto</option>
                <option value="suficiencia">Suficiencia</option>
                <option value="comprometido">Comprometido</option>
                <option value="devengado">Devengado</option>
                <option value="saldo_disponible">Saldo</option>
                <option value="porcentaje_ejercido">% Ejercido</option>
              </select>
            </div>
            <div class="col-12 col-lg-2 d-grid">
              <button id="btnAplicar" class="btn btn-primary">
                <i class="bi bi-funnel me-1"></i>Aplicar
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm dp-card">
        <div class="card-body">
          <div class="chart-wrapper">
            <canvas id="chartPartidas"></canvas>
          </div>
          <div id="chartFootnote" class="small text-muted mt-2"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/session-guard.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/user-info.js"></script>
  <script src="/js/dashboard_partidas_grafica.js"></script>
</body>

</html>
