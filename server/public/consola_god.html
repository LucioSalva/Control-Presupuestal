<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <style>
    :root {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");
        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }
        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Consola GOD — Monitoreo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/consola_god.css">
</head>

<body class="admin-body">
  <div id="cp-navbar"></div>

  <div class="container-fluid py-4">
    <div class="topbar mb-3">
      <div class="topbar-left">
        <div class="topbar-icon">
          <i class="bi bi-activity"></i>
        </div>
        <div>
          <div class="topbar-title">Consola de Monitoreo</div>
          <div class="topbar-subtitle">Panel GOD — Actividad del sistema (actualiza cada 5s)</div>
        </div>
      </div>

      <div class="topbar-actions d-flex gap-2">
        <button class="btn btn-ghost" id="btnRefrescar">
          <i class="bi bi-arrow-clockwise"></i>
          Refrescar
        </button>
        <div class="dropdown">
          <button class="btn btn-primary btn-glow dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-download me-1"></i>
            Exportar
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" id="btnExportCsv">CSV</button></li>
            <li><button class="dropdown-item" id="btnExportXlsx">Excel</button></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="card card-glass mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label mb-1">Tipo</label>
            <select class="form-select" id="fTipo">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label mb-1">Usuario</label>
            <select class="form-select" id="fUsuario">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label mb-1">Desde</label>
            <input type="datetime-local" class="form-control" id="fDesde">
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <label class="form-label mb-1">Hasta</label>
            <input type="datetime-local" class="form-control" id="fHasta">
          </div>
          <div class="col-12 col-lg-4">
            <label class="form-label mb-1">Búsqueda</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input class="form-control" id="fBuscar"
                placeholder="folio, usuario, ruta, entidad, estado, detalles...">
              <button class="btn btn-outline-secondary" type="button" id="btnLimpiar">Limpiar</button>
            </div>
          </div>
          <div class="col-12 d-flex flex-wrap gap-3 align-items-center justify-content-between mt-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="fAuto" checked>
              <label class="form-check-label" for="fAuto">Actualización automática</label>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <small class="text-muted" id="lblEstado">—</small>
              <button class="btn btn-outline-primary" id="btnAplicar">
                <i class="bi bi-funnel"></i>
                Aplicar filtros
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-glass">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-2">
          <div>
            <span class="badge text-bg-dark" id="badgeTotal">0</span>
            <small class="text-muted ms-2" id="lblRango">—</small>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="btnCargarMas">
            <i class="bi bi-chevron-down"></i>
            Cargar anteriores
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle table-pro" id="tablaLogs">
            <thead>
              <tr>
                <th class="text-nowrap">ID</th>
                <th class="text-nowrap">Timestamp</th>
                <th class="text-nowrap">Tipo</th>
                <th class="text-nowrap">Usuario</th>
                <th class="text-nowrap">Área</th>
                <th class="text-nowrap">Estado</th>
                <th class="text-nowrap">IP</th>
                <th class="text-nowrap">Auth</th>
                <th class="text-nowrap">Entidad</th>
                <th class="text-nowrap">Ruta</th>
                <th class="text-nowrap">Detalles</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/safe-render.js"></script>
  <script src="/js/session-guard.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/user-info.js"></script>
  <script src="/js/consola_god.js"></script>
</body>

</html>
