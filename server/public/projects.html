<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <style>
    :root {
      visibility: hidden;
    }
  </style>

  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");

        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }

        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Control de Presupuesto — Proyectos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Tus estilos globales -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
</head>

<body class="theme-projects">
  <div id="cp-navbar"></div>


  <main class="projects-main container">
    <!-- ROW KPI -->
    <div class="row g-3 mb-3 mt-5" id="kpi-row">
      <div class="col-12 col-md-3">
        <div class="card-kpi d-flex justify-content-between align-items-center">
          <div>
            <div class="title">Proyectos</div>
            <div id="kpi-projects" class="value">—</div>
          </div>
          <div class="display-6">
            <i class="bi bi-diagram-3"></i>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card-kpi d-flex justify-content-between align-items-center">
          <div>
            <div class="title">Presupuesto total</div>
            <div id="kpi-presupuesto" class="value">—</div>
          </div>
          <div class="display-6">
            <i class="bi bi-piggy-bank"></i>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card-kpi d-flex justify-content-between align-items-center">
          <div>
            <div class="title">Gastado total</div>
            <div id="kpi-gastado" class="value">—</div>
          </div>
          <div class="display-6">
            <i class="bi bi-cash-stack"></i>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card-kpi d-flex justify-content-between align-items-center">
          <div>
            <div class="title">Saldo total</div>
            <div id="kpi-saldo" class="value">—</div>
          </div>
          <div class="display-6">
            <i class="bi bi-graph-up-arrow"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- CARD PRINCIPAL: LISTADO DE PROYECTOS -->
    <div class="card card-proyectos shadow-sm border-0">
      <div class="card-header bg-white">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
          <div>
            <h5 class="mb-0">Listado de proyectos</h5>
            <small class="text-secondary">
              Haz clic en “Ver detalle” para abrir el proyecto.
            </small>
          </div>

          <div class="d-flex gap-2">
            <input id="search-project" type="text" class="form-control form-control-sm search-input"
              placeholder="Buscar proyecto…">
            <button id="btn-clear" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Limpiar búsqueda">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-light-custom mb-0">
            <thead>
              <tr>
                <th>Proyecto</th>
                <th class="text-end">Partidas</th>
                <th class="text-end">Presupuesto</th>
                <th class="text-end">Gastado</th>
                <th class="text-end">Saldo</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody-projects">
              <tr>
                <td colspan="6" class="text-center py-4 text-secondary">
                  <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                  Cargando proyectos…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer small text-secondary d-flex justify-content-between">
        <span id="summary-label">0 proyecto(s) mostrados.</span>
        <span>Actualizado automáticamente.</span>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tu lógica de proyectos -->
  <script src="/js/session-guard.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/user-info.js"></script>
</body>

</html>
