<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Partidas permitidas — Control Presupuestal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/navbar.css" />
    <link rel="stylesheet" href="/css/partidas.css" />
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg shadow-sm cp-main-nav">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold">
                <i class="bi bi-currency-dollar me-2"></i>Control Presupuestal
            </a>

            <div class="logo-container">
                <img src="/img/ayuntamiento-de-ecatepec.png" alt="Ayuntamiento de Ecatepec"
                    class="cp-logo navbar-logo" />
            </div>

            <div class="ms-auto d-flex gap-2 align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <span id="userInfo" class="text-white fw-bold"></span>
                    <button id="btnLogout" class="btn btn-sm btn-outline-light bi bi-door-open">
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- NAVBAR DE PESTAÑAS -->
    <nav class="navbar  navbar-light bg-light shadow-sm cp-tabs-nav">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 cp-tabs">
                <li class="nav-item">
                    <a class="nav-link" href="suficiencia_presupuestal.html">
                        <i class="bi bi-file-earmark-text me-1"></i>Suficiencia
                        Presupuestal
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="comprometido.html">
                        <i class="bi bi-lock me-1"></i>Comprometido
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="devengado.html">
                        <i class="bi bi-check2-square me-1"></i>Devengado
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="projects.html">
                        <i class="bi bi-diagram-3 me-1"></i>Proyectos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard_partidas.html">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard Partidas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="partidas_base.html">
                        <i class="bi bi-list-check me-1"></i>Partidas
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="container-xxl">

            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
                <div>
                    <h2 class="mb-1">Partidas Presupuestales</h2>
                    <div class="text-muted">Acceso exclusivo para DG L00 / DA 117. Captura el monto de presupuesto.</div>
                    <div class="small text-muted mt-1">DG/DA: <span id="dgda">—</span></div>
                </div>

                <div class="d-flex gap-2">
                    <button id="btnReload" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Recargar
                    </button>
                    <button id="btnGuardar" class="btn btn-success">
                        <i class="bi bi-check2-square me-1"></i>Guardar cambios
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-12 col-md-6 col-lg-5">
                            <label class="form-label mb-1">Buscar</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input id="q" type="text" class="form-control" placeholder="Clave o descripción...">
                                <button id="btnClear" class="btn btn-outline-secondary" type="button">Limpiar</button>
                            </div>
                        </div>

                        <div class="col-6 col-md-3 col-lg-2">
                            <label class="form-label mb-1">Por página</label>
                            <select id="pageSize" class="form-select">
                                <option value="10">10</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3 col-lg-2">
                            <label class="form-label mb-1">Página</label>
                            <div class="input-group">
                                <button id="btnPrev" class="btn btn-outline-secondary" type="button"><i
                                        class="bi bi-chevron-left"></i></button>
                                <input id="page" class="form-control text-center" value="1" />
                                <button id="btnNext" class="btn btn-outline-secondary" type="button"><i
                                        class="bi bi-chevron-right"></i></button>
                            </div>
                        </div>

                        <div class="col-12 col-lg-3 text-lg-end">
                            <div class="small text-muted mt-2 mt-lg-4">
                                <span id="countInfo">—</span>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 160px;">Partidas</th>
                                    <th>Descripción</th>
                                    <th style="width: 280px;" class="text-end">Monto ($)</th>
                                    <th style="width: 140px;" class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbody">
                                <tr>
                                    <td colspan="4" class="text-muted">Cargando…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/js/session-guard.js"></script>
    <script src="/js/user-info.js"></script>
    <script src="/js/partidas.js"></script>
</body>

</html>
