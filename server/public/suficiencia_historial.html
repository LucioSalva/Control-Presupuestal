<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");
        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }
        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Historial de Suficiencias — Control Presupuestal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/suficiencia_historial.css">
</head>
<body class="suf-historial-page">
  <div id="cp-navbar"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <div>
        <h4 class="mb-1 historial-title">Historial de Suficiencias</h4>
        <div class="text-muted">Listado general con estatus y tiempos</div>
      </div>
      <div class="d-flex gap-2">
        <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
        </button>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5">
            <label class="form-label">Buscar</label>
            <input id="fBuscar" class="form-control form-control-sm" placeholder="Número de suficiencia, estatus o motivo">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Estatus</label>
            <select id="fEstatus" class="form-select form-select-sm">
              <option value="">Todos</option>
              <option value="VIGENTE">Vigente</option>
              <option value="CANCELADA">Cancelada</option>
              <option value="EXPIRADA">Expirada</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Filas</label>
            <select id="fPageSize" class="form-select form-select-sm">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="col-12 col-md-2 text-md-end">
            <div id="lblResumen" class="small text-muted"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="text-nowrap">No. Suficiencia</th>
            <th class="text-nowrap">Estatus</th>
            <th class="text-nowrap">Tiempo transcurrido</th>
            <th class="text-nowrap">Tiempo restante</th>
            <th>Motivo cancelación</th>
            <th class="text-center text-nowrap">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyHistorial"></tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <div id="lblPaginacion" class="small text-muted"></div>
      <div class="btn-group">
        <button id="btnPrev" class="btn btn-outline-secondary btn-sm">Anterior</button>
        <button id="btnNext" class="btn btn-outline-secondary btn-sm">Siguiente</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/user-info.js"></script>
  <script src="/js/suficiencia_historial.js"></script>
</body>
</html>
