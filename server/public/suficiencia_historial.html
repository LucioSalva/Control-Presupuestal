<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");
        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }
        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Historial de Suficiencias — Control Presupuestal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/suficiencia_historial.css">
</head>
<body class="suf-historial-page">
  <div id="cp-navbar"></div>

  <main class="sh-main container-fluid py-4">

    <!-- ================================================
         TOPBAR DE LA PÁGINA
         ================================================ -->
    <div class="sh-topbar mb-4">
      <div class="sh-topbar__info">
        <div class="sh-topbar__icon">
          <i class="bi bi-clock-history"></i>
        </div>
        <div>
          <h4 class="sh-topbar__title mb-0">Historial de Suficiencias</h4>
          <div class="sh-topbar__subtitle">Listado general con estatus y tiempos de validez</div>
        </div>
      </div>
      <div class="sh-topbar__actions">
        <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
        </button>
      </div>
    </div>

    <!-- ================================================
         PANEL DE FILTROS
         ================================================ -->
    <div class="sh-filtros-card mb-3">
      <div class="sh-filtros-card__header">
        <i class="bi bi-funnel me-1"></i>Filtros de búsqueda
      </div>
      <div class="sh-filtros-card__body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5">
            <label class="form-label sh-label">Buscar</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white">
                <i class="bi bi-search text-muted"></i>
              </span>
              <input id="fBuscar" class="form-control"
                placeholder="Número de suficiencia, estatus o motivo"
                autocomplete="off">
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label sh-label">Estatus</label>
            <select id="fEstatus" class="form-select form-select-sm">
              <option value="">Todos</option>
              <option value="VIGENTE">Vigente</option>
              <option value="CANCELADA">Cancelada</option>
              <option value="EXPIRADA">Expirada</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label sh-label">Filas por página</label>
            <select id="fPageSize" class="form-select form-select-sm">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="col-12 col-md-2 text-md-end">
            <div id="lblResumen" class="sh-resumen-text small text-muted"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================
         TABLA DE HISTORIAL
         ================================================ -->
    <div class="sh-table-card">
      <div class="table-responsive sh-table-scroll">
        <table class="table table-hover align-middle mb-0 sh-table">
          <thead>
            <tr>
              <th class="sh-th text-nowrap">
                <i class="bi bi-hash me-1 opacity-50"></i>No. Suficiencia
              </th>
              <th class="sh-th text-nowrap">Estatus</th>
              <th class="sh-th text-nowrap">
                <i class="bi bi-stopwatch me-1 opacity-50"></i>Tiempo transcurrido
              </th>
              <th class="sh-th text-nowrap">
                <i class="bi bi-hourglass-split me-1 opacity-50"></i>Tiempo restante
              </th>
              <th class="sh-th">Motivo cancelación</th>
              <th class="sh-th text-center text-nowrap">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyHistorial"></tbody>
        </table>
      </div>
    </div>

    <!-- ================================================
         PAGINACIÓN
         ================================================ -->
    <div class="sh-paginacion mt-3">
      <div id="lblPaginacion" class="sh-paginacion__info small text-muted"></div>
      <div class="btn-group btn-group-sm" role="group" aria-label="Paginación">
        <button id="btnPrev" class="btn btn-outline-secondary">
          <i class="bi bi-chevron-left me-1"></i>Anterior
        </button>
        <button id="btnNext" class="btn btn-outline-secondary">
          Siguiente<i class="bi bi-chevron-right ms-1"></i>
        </button>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/user-info.js"></script>
  <script src="/js/suficiencia_historial.js"></script>
</body>
</html>
