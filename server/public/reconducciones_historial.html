<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      try {
        const u = localStorage.getItem("cp_usuario");
        const t = localStorage.getItem("cp_token");
        if (!u || !t) {
          window.location.replace("login.html");
          return;
        }
        document.documentElement.style.visibility = "visible";
      } catch (e) {
        document.documentElement.style.visibility = "visible";
      }
    })();
  </script>
  <title>Autorización y Historial de Reconducciones — Control Presupuestal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/suficiencia_historial.css">
</head>
<body class="rc-historial-page">
  <div id="cp-navbar"></div>

  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <div>
        <h4 class="mb-1 historial-title">Autorización y Historial de Reconducciones</h4>
        <div class="text-muted">Control de acceso y listado general de reconducciones</div>
      </div>
      <div class="d-flex gap-2">
        <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
        </button>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-4">
            <label class="form-label">Última clave generada</label>
            <div id="txtClave" class="form-control form-control-sm bg-light">—</div>
          </div>
          <div class="col-12 col-md-8 d-flex flex-wrap gap-2 align-items-end">
            <button id="btnGenerarClave" class="btn btn-primary btn-sm">General</button>
            <button id="btnCopiarClave" class="btn btn-outline-secondary btn-sm">Copiar clave</button>
            <div class="text-muted small">Solo L00 117 puede generar y ver el historial.</div>
          </div>
        </div>
        <div class="table-responsive mt-3">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Clave</th>
                <th>Área</th>
                <th>Estado</th>
                <th>Creada</th>
                <th>Usada</th>
              </tr>
            </thead>
            <tbody id="tbodyClaves">
              <tr>
                <td colspan="5" class="text-center text-muted py-2">Sin claves</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5">
            <label class="form-label">Buscar</label>
            <input id="fBuscar" class="form-control form-control-sm" placeholder="ID, oficio, estatus o tipo">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Estatus</label>
            <select id="fEstatus" class="form-select form-select-sm">
              <option value="">Todos</option>
              <option value="BORRADOR">Borrador</option>
              <option value="ENVIADO">Enviado</option>
              <option value="AUTORIZADO">Autorizado</option>
              <option value="APLICADO">Aplicado</option>
              <option value="CANCELADO">Cancelado</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Filas</label>
            <select id="fPageSize" class="form-select form-select-sm">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="col-12 col-md-2 text-md-end">
            <div id="lblResumen" class="small text-muted"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="text-nowrap">ID</th>
            <th class="text-nowrap">Oficio</th>
            <th class="text-nowrap">Fecha</th>
            <th class="text-nowrap">Tipo</th>
            <th class="text-nowrap">Estatus</th>
            <th class="text-end text-nowrap">Total origen</th>
            <th class="text-end text-nowrap">Total destino</th>
            <th class="text-end text-nowrap">Diferencia</th>
            <th class="text-center text-nowrap">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyRecon"></tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <div id="lblPaginacion" class="small text-muted"></div>
      <div class="btn-group">
        <button id="btnPrev" class="btn btn-outline-secondary btn-sm">Anterior</button>
        <button id="btnNext" class="btn btn-outline-secondary btn-sm">Siguiente</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/user-info.js"></script>
  <script src="/js/reconducciones_historial.js"></script>
</body>
</html>
